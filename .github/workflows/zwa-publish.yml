# Publishes a ZWA CMS site. ZWA CMS's scheduler Worker starts it when a
# scheduled post becomes due; it can also be run by hand from the Actions tab.
# The secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / ZWA_SITE_ID are
# set by ZWA CMS when the site is linked.
name: ZWA CMS publish

on:
  workflow_dispatch:

# One publish at a time; a newer request waits for the running one.
concurrency:
  group: zwa-publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The zwa version (tag) to use. Change it to update.
  ZWA_VERSION: main
  # Secrets are passed as environment variables only, never written into
  # the commands, so a secret's value can never run as a command.
  ZWA_SITE_ID: ${{ secrets.ZWA_SITE_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check the secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::The secrets are not set. Link this repository from ZWA CMS (Site info → GitHub)."
            exit 1
          fi
          if ! [[ "$ZWA_SITE_ID" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::ZWA_SITE_ID is missing or not a site ID. Link this repository from ZWA CMS again."
            exit 1
          fi

      - name: Cache zwa
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/zwa
          key: zwa-${{ runner.os }}-${{ env.ZWA_VERSION }}

      # Only the first time (and after changing ZWA_VERSION). Takes about 10 minutes.
      - name: Install zwa
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/imo-tikuwa/zwa-cms --branch "$ZWA_VERSION" --locked zwa-cli

      - name: Publish
        run: zwa publish --site "$ZWA_SITE_ID"
